name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (WinUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build App (self-contained)
        run: |
          msbuild Opaline.App\Opaline.App.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:WindowsAppSDKSelfContained=true /p:SelfContained=true /p:PublishSingleFile=false /p:WindowsPackageType=None /p:GenerateAppxPackageOnBuild=false /m

      - name: Stage & zip
        shell: pwsh
        run: |
          $out = "Opaline-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bin = Get-ChildItem -Path "Opaline.App\bin" -Recurse -Filter "Opaline.App.exe" | Select-Object -First 1
          if (-not $bin) { throw "Opaline.App.exe not found" }
          $dir = $bin.Directory.FullName
          Copy-Item -Path (Join-Path $dir "*") -Destination $out -Recurse -Force
          if (Test-Path "Opaline.App\run-opaline.cmd") { Copy-Item "Opaline.App\run-opaline.cmd" $out -Force }
          # Also expose bare exe path for release notes clarity
          Copy-Item $bin.FullName -Destination "Opaline.App.exe" -Force
          Compress-Archive -Path $out -DestinationPath "Opaline-Windows-x64.zip" -Force
          Get-Item "Opaline-Windows-x64.zip", "Opaline.App.exe" | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Opaline-Windows-x64.zip
            Opaline.App.exe
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install build tools
        run: |
          brew install swiftlint ldid-procursus || true
          brew unlink ldid 2>/dev/null || true
          brew install ldid-procursus 2>/dev/null || true
          which swiftlint || true
          which ldid || true
          ldid 2>&1 | head -2 || true

      - name: Ensure Local.xcconfig
        working-directory: ios
        run: |
          if [ ! -f Config/Local.xcconfig ]; then
            cp Config/Local.xcconfig.example Config/Local.xcconfig
          fi
          ls -la Config/
          cat Config/Local.xcconfig

      - name: Build unsigned IPA
        working-directory: ios
        env:
          UPDATE_SOURCE: "0"
          IPA_VERSION: "0.0.${{ github.run_number }}"
          BUILD_NUMBER: "${{ github.run_number }}"
          XCODEBUILD_EXTRA_ARGS: "CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_ALLOWED=NO"
        run: |
          set -e
          chmod +x make_ipa.sh
          # Ensure xcodebuild gets unsigned flags
          export XCODEBUILD_EXTRA_ARGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="
          ./make_ipa.sh
          ls -lh Opaline_*.ipa
          # Normalize name for release
          IPA=$(ls -1 Opaline_*.ipa | head -1)
          cp "$IPA" "../Opaline-iOS-unsigned.ipa"
          cp "$IPA" "../Opaline_${IPA_VERSION}.ipa"

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: |
            Opaline-iOS-unsigned.ipa
            Opaline_*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [windows, ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && always() && needs.windows.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Download iOS artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: dist

      - name: List dist
        run: ls -lah dist/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Automated build from `main` (`${{ github.sha }}`).

            ### Windows
            - `Opaline-Windows-x64.zip` — 完整自包含包（解压后运行 `Opaline.App.exe`）
            - `Opaline.App.exe` — 主程序（仍需同目录 DLL，推荐用 zip）

            ### iOS
            - `Opaline-iOS-unsigned.ipa` — **未签名** IPA（越狱 / AppSync / 侧载）
            - `Opaline_0.0.${{ github.run_number }}.ipa` — 带版本号 IPA

            安装 iOS：拷到设备 → Filza → Install（需 AppSync）。
          files: |
            dist/Opaline-Windows-x64.zip
            dist/Opaline.App.exe
            dist/Opaline-iOS-unsigned.ipa
            dist/Opaline_*.ipa
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
