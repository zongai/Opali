name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build Core
        run: dotnet build Opaline.Core/Opaline.Core.csproj -c Release --no-restore

      - name: Build App (self-contained)
        run: |
          msbuild Opaline.App\Opaline.App.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:WindowsAppSdkBootstrapInitialize=false `
            /p:SelfContained=true `
            /p:EnableMsixTooling=true `
            /p:GenerateAppxPackageOnBuild=false `
            /restore

      - name: Publish self-contained win-x64
        run: |
          dotnet publish Opaline.App/Opaline.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsAppSdkBootstrapInitialize=false `
            -p:WindowsAppSdkUndockedRegFreeWinRTInitialize=true `
            -p:EnableMsixTooling=true `
            -p:PublishTrimmed=false `
            -p:PublishSingleFile=false `
            -p:GenerateAppxPackageOnBuild=false `
            -o publish/win-x64-sc

      - name: Verify self-contained payload
        shell: pwsh
        run: |
          $dir = "publish/win-x64-sc"
          foreach ($n in @("Opaline.App.exe","Microsoft.WindowsAppRuntime.dll","Microsoft.WinUI.dll","run-opaline.cmd")) {
            if (-not (Test-Path (Join-Path $dir $n))) { throw "MISSING $n" }
            Write-Host "OK $n"
          }

      - name: Publish framework-dependent (needs Windows App Runtime 2.5 installed)
        run: |
          dotnet publish Opaline.App/Opaline.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=false `
            -p:WindowsAppSdkBootstrapInitialize=true `
            -p:EnableMsixTooling=true `
            -p:PublishTrimmed=false `
            -p:PublishSingleFile=false `
            -p:GenerateAppxPackageOnBuild=false `
            -o publish/win-x64-fd

      - uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64-SelfContained
          path: publish/win-x64-sc
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64-FrameworkDependent
          path: publish/win-x64-fd
          if-no-files-found: error
          retention-days: 14
