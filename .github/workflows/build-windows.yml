name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (x64 Release)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build Core
        run: dotnet build Opaline.Core\Opaline.Core.csproj -c Release --no-restore

      - name: Build App
        id: buildapp
        continue-on-error: true
        run: |
          dotnet build Opaline.App\Opaline.App.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None --no-restore -v:n

      - name: Show XAML compiler output.json
        if: always()
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse Opaline.App\obj -Filter output.json -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            Write-Host "======== $($f.FullName) ========"
            Get-Content $f.FullName -Raw
          }
          $inputs = Get-ChildItem -Recurse Opaline.App\obj -Filter input.json -ErrorAction SilentlyContinue
          Write-Host "input.json count: $($inputs.Count)"

      - name: Fail if build failed
        if: steps.buildapp.outcome == 'failure'
        run: exit 1

      - name: Publish
        run: |
          dotnet publish Opaline.App\Opaline.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true --self-contained true -o publish\win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
