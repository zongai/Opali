name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build Core
        run: dotnet build Opaline.Core/Opaline.Core.csproj -c Release --no-restore

      - name: Build App
        run: |
          msbuild Opaline.App\Opaline.App.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:SelfContained=true `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /restore

      - name: Publish self-contained win-x64
        run: |
          dotnet publish Opaline.App/Opaline.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsAppSdkSelfContained=true `
            -p:WindowsAppSdkDeploymentManagerInitialize=false `
            -p:EnableMsixTooling=false `
            -p:EnableCoreMrtTooling=false `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -o publish/win-x64

      - name: Verify Windows App Runtime is embedded
        shell: pwsh
        run: |
          $dir = "publish/win-x64"
          Write-Host "=== Publish output (key files) ==="
          Get-ChildItem $dir -File | Sort-Object Length -Descending | Select-Object -First 40 Name, Length
          Write-Host ""
          $needles = @(
            "Microsoft.WindowsAppRuntime.Bootstrap.dll",
            "Microsoft.WindowsAppRuntime.dll",
            "Microsoft.WinUI.dll",
            "Opaline.App.exe"
          )
          foreach ($n in $needles) {
            $f = Join-Path $dir $n
            if (Test-Path $f) { Write-Host "OK  $n  $((Get-Item $f).Length) bytes" }
            else { Write-Host "MISSING  $n" }
          }
          # Any WASDK runtime payload
          Get-ChildItem $dir -Recurse -Filter "*WindowsAppRuntime*" | ForEach-Object { Write-Host $_.FullName.Replace((Resolve-Path $dir).Path + '\', '') }

      - uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
