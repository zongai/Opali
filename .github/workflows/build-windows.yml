name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build Core
        run: dotnet build Opaline.Core/Opaline.Core.csproj -c Release --no-restore

      - name: Build App (MSBuild + VS tooling)
        run: |
          msbuild Opaline.App\Opaline.App.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:EnableMsixTooling=false `
            /p:GenerateAppxPackageOnBuild=false `
            /restore

      - name: Publish
        run: |
          dotnet publish Opaline.App/Opaline.App.csproj `
            -c Release -r win-x64 `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:EnableMsixTooling=false `
            -p:EnableCoreMrtTooling=false `
            --self-contained true `
            -o publish/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
