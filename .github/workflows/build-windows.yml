name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (x64 Release)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build Opaline.Core
        run: dotnet build Opaline.Core\Opaline.Core.csproj -c Release --no-restore

      - name: Build Opaline.App (WinUI)
        run: >
          dotnet build Opaline.App\Opaline.App.csproj
          -c Release
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          --no-restore

      - name: Publish unpackaged (win-x64)
        run: >
          dotnet publish Opaline.App\Opaline.App.csproj
          -c Release
          -r win-x64
          -p:Platform=x64
          -p:PublishSingleFile=false
          -p:WindowsAppSDKSelfContained=true
          -p:WindowsPackageType=None
          --self-contained true
          -o publish\win-x64

      - name: List publish output
        run: Get-ChildItem -Recurse publish\win-x64 | Select-Object -First 40 FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
