name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore Opaline.Windows.sln

      - name: Build Core
        run: dotnet build Opaline.Core/Opaline.Core.csproj -c Release --no-restore

      - name: Build App
        run: |
          msbuild Opaline.App\Opaline.App.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:SelfContained=true `
            /p:EnableMsixTooling=true `
            /p:GenerateAppxPackageOnBuild=false `
            /restore

      - name: Publish self-contained win-x64
        run: |
          dotnet publish Opaline.App/Opaline.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:EnableMsixTooling=true `
            -p:WindowsAppSdkUndockedRegFreeWinRTInitialize=true `
            -p:PublishTrimmed=false `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:GenerateAppxPackageOnBuild=false `
            -o publish/win-x64

      - name: Verify runtime payload
        shell: pwsh
        run: |
          $dir = "publish/win-x64"
          $needles = @(
            "Opaline.App.exe",
            "Microsoft.WindowsAppRuntime.Bootstrap.dll",
            "Microsoft.WindowsAppRuntime.dll",
            "Microsoft.WinUI.dll",
            "Microsoft.WindowsAppRuntime.Bootstrap.Net.dll"
          )
          foreach ($n in $needles) {
            $f = Join-Path $dir $n
            if (Test-Path $f) { Write-Host "OK  $n  $((Get-Item $f).Length)" }
            else { Write-Host "MISSING  $n"; exit 1 }
          }
          # App.pri / resources often required
          Get-ChildItem $dir -Filter "*.pri" | ForEach-Object { Write-Host "PRI $($_.Name) $($_.Length)" }
          Write-Host "File count:" (Get-ChildItem $dir -File).Count

      - uses: actions/upload-artifact@v4
        with:
          name: Opaline-Windows-x64
          path: publish/win-x64
          if-no-files-found: error
          retention-days: 14
